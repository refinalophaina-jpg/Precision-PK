            <label style={S.label}>BMD MIC (mg/L)</label>
            <input style={S.input} type="number" step="0.5" value={patient.mic} onChange={e=>set('mic',+e.target.value)} placeholder="1.0"/>
          </div>
          <div>
            <label style={S.label}>Infection Type</label>
            <select value={patient.infection_type} onChange={e=>set('infection_type',e.target.value)} style={S.select}>
              {Object.entries(INFECTION_TYPES_DB).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
        </div>
      </div>

      {patient.mode==='neonatal'&&(
        <div style={S.card}>
          <div style={{...S.h3,marginBottom:'14px'}}>Neonatal Parameters</div>
          <div className='ad-grid-2' style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
            <div><label style={S.label}>PMA Weeks</label><input style={S.input} type="number" value={patient.pma_weeks} onChange={e=>set('pma_weeks',+e.target.value)}/></div>
            <div><label style={S.label}>PMA Days</label><input style={S.input} type="number" value={patient.pma_days} onChange={e=>set('pma_days',+e.target.value)}/></div>
            <div><label style={S.label}>Postnatal Days</label><input style={S.input} type="number" value={patient.postnatal_days} onChange={e=>set('postnatal_days',+e.target.value)}/></div>
            <div><label style={S.label}>Birth Weight (kg)</label><input style={S.input} type="number" step="0.1" value={patient.birth_weight_kg} onChange={e=>set('birth_weight_kg',+e.target.value)}/></div>
          </div>
          {patient.postnatal_days<3&&(
            <div style={{marginTop:'10px',padding:'8px 12px',background:'rgba(245,158,11,0.1)',borderRadius:'6px',border:'1px solid #f59e0b40',fontSize:'12px',color:'#d97706'}}>
              ⚠ Postnatal age &lt; 72h — SCr reflects maternal creatinine. Do not use for CrCl estimation.
            </div>
          )}
        </div>
      )}

      {/* Auto-calculated values */}
      {(patient.ibw_kg||patient.crcl)&&(
        <div style={{...S.card,background:'#f8fafc'}}>
          <div style={{...S.h3,marginBottom:'12px'}}>Auto-Calculated</div>
          <div className='ad-grid-3' style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'12px'}}>
            {patient.ibw_kg&&<div>
              <div style={S.label}>IBW</div>
              <div style={{...S.mono,...S.cyan,fontSize:'16px',fontWeight:'700'}}>{patient.ibw_kg.toFixed(1)} kg</div>
              <div style={{fontSize:'10px',...S.muted}}>{patient.height_cm&&(+patient.height_cm/2.54)<60?'BMI method (Pai 2004)':'Devine formula'}</div>
            </div>}
            {patient.bmi&&<div>
              <div style={S.label}>BMI</div>
              <div style={{...S.mono,fontSize:'16px',fontWeight:'700',color:PK.bmiColor(patient.bmi)}}>{patient.bmi.toFixed(1)}</div>
              <div style={{fontSize:'10px',color:PK.bmiColor(patient.bmi),fontWeight:'600'}}>{PK.bmiClass(patient.bmi)}</div>
            </div>}
            {patient.crcl&&<div>
              <div style={S.label}>CrCl</div>
              <div style={{...S.mono,fontSize:'16px',fontWeight:'700',color:patient.crcl>130?'#7c3aed':patient.crcl<30?'#dc2626':'#059669'}}>{patient.crcl.toFixed(0)} mL/min</div>
              <div style={{fontSize:'10px',...S.muted}}>
                {patient.crcl>130?'ARC (Augmented)':patient.crcl<30?'Renal Impairment':'Cockcroft-Gault'}
                {(()=>{
                  const ibw=patient.ibw_kg; const abw=+patient.abw_kg; const bmi=patient.bmi;
                  if(!ibw||!abw||!bmi) return null;
                  const wlabel = abw<=ibw?'ABW':'AdjBW';
                  return <span style={{marginLeft:'4px',color:'#0891b2'}}>· wt: {wlabel}</span>;
                })()}
              </div>
            </div>}
          </div>
        </div>
      )}

      {/* Amputation CrCl Adjustment */}
      <div style={S.card}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'10px'}}>
          <div style={S.h3}>Amputation CrCl Adjustment</div>
          <div style={{fontSize:'10px',color:'#94a3b8'}}>Osterkamp 1995 % body weight</div>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'10px'}}>
          {AMPUTATION_SEGMENTS.map(({k,l})=>{
            const active=(patient.amputations||[]).includes(k);
            return (
              <button key={k} onClick={()=>toggleAmp(k)} style={{
                padding:'5px 10px',borderRadius:'20px',cursor:'pointer',fontSize:'11px',fontWeight:'600',
                background:active?'#7c3aed15':'#f1f5f9',
                color:active?'#7c3aed':'#64748b',
                border:`1px solid ${active?'#7c3aed':'#e2e8f0'}`,
              }}>{l}</button>
            );
          })}
        </div>
        {patient.amp_adj_wt&&(
          <div style={{padding:'10px 14px',background:'#f5f3ff',borderRadius:'8px',border:'1px solid #c4b5fd',fontSize:'13px'}}>
            <span style={{color:'#7c3aed',fontWeight:'700'}}>Adjusted Weight: {patient.amp_adj_wt.toFixed(1)} kg</span>
            <span style={{color:'#94a3b8',fontSize:'11px',marginLeft:'10px'}}>(was {patient.abw_kg} kg → used for CrCl only)</span>
          </div>
        )}
      </div>

      {/* Infection-specific AUC/Trough targets */}
      {patient.infection_type && INFECTION_TYPES_DB[patient.infection_type] && (
        <div style={{...S.card,background:'#f0f9ff',border:'1px solid #bae6fd'}}>
          <div style={{...S.h3,marginBottom:'8px',color:'#0369a1'}}>Infection-Specific Targets</div>
          {(()=>{
            const inf = INFECTION_TYPES_DB[patient.infection_type];
            return (
              <div>
                <div style={{display:'flex',gap:'20px',marginBottom:'8px',flexWrap:'wrap'}}>
                  <div><span style={S.label}>AUC₂₄ Target</span><div style={{...S.mono,color:'#0891b2',fontWeight:'700',fontSize:'14px'}}>{inf.aucLow}–{inf.aucHigh} mg·h/L</div></div>
                  <div><span style={S.label}>Trough Target</span><div style={{...S.mono,color:'#059669',fontWeight:'700',fontSize:'14px'}}>{inf.troughLow}–{inf.troughHigh} mg/L</div></div>
                </div>
                <div style={{fontSize:'12px',color:'#475569',lineHeight:'1.5'}}>{inf.note}</div>
              </div>
            );
          })()}
        </div>
      )}

      {/* Nephrotoxins */}
      <div style={S.card}>
        <div style={{...S.h3,marginBottom:'12px'}}>Concurrent Nephrotoxins</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
          {Object.entries(NEPHROTOXINS).map(([k,n])=>{
            const active=patient.nephrotoxins.includes(k);
            const col=n.alert==='DANGER'?'#dc2626':n.alert==='WARN'?'#d97706':'#0891b2';
            return (
              <button key={k} onClick={()=>dispatch({type:'TOGGLE_NEPHROTOXIN',key:k})} style={{
                padding:'5px 10px',borderRadius:'20px',cursor:'pointer',fontSize:'11px',fontWeight:'600',
                background:active?`${col}15`:'#f1f5f9',
                color:active?col:'#64748b',
                border:`1px solid ${active?col:'#334155'}`,
              }}>{n.name}</button>
            );
          })}
        </div>
        {patient.nephrotoxins.length>0&&(
          <div style={{marginTop:'10px',display:'flex',flexDirection:'column',gap:'4px'}}>
            {patient.nephrotoxins.map(k=>(
              <div key={k} style={{fontSize:'12px',color:'#94a3b8',paddingLeft:'8px',borderLeft:'2px solid #334155'}}>
                <span style={{color:NEPHROTOXINS[k].alert==='DANGER'?'#dc2626':'#d97706',fontWeight:'700'}}>{NEPHROTOXINS[k].name}</span>: {NEPHROTOXINS[k].action}
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Clinical Documentation */}
      <div style={S.card}>
        <div style={{...S.h3,marginBottom:'14px'}}>Clinical Documentation</div>
        <div style={{fontSize:'11px',color:'#64748b',marginBottom:'12px'}}>These fields populate the progress note generator. All are optional.</div>
        <div className='ad-grid-2' style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
          <div>
            <label style={S.label}>Antibiotic Day</label>
            <input style={S.input} type="number" value={patient.antibiotic_day} onChange={e=>set('antibiotic_day',e.target.value)} placeholder="e.g. 3"/>
          </div>
          <div>
            <label style={S.label}>Clinical Status</label>
            <select value={patient.clinical_status} onChange={e=>set('clinical_status',e.target.value)} style={S.select}>
              <option value="">— Select —</option>
              <option value="improving">Improving</option>
              <option value="stable">Stable</option>
              <option value="worsening">Worsening</option>
            </select>
          </div>
          <div>
            <label style={S.label}>WBC (×10³/μL)</label>
            <input style={S.input} type="number" step="0.1" value={patient.wbc} onChange={e=>set('wbc',e.target.value)} placeholder="e.g. 12.5"/>
          </div>
          <div>
            <label style={S.label}>Temp (°F)</label>
            <input style={S.input} type="number" step="0.1" value={patient.temp} onChange={e=>set('temp',e.target.value)} placeholder="e.g. 101.2"/>
          </div>
          <div>
            <label style={S.label}>Procalcitonin (ng/mL)</label>
            <input style={S.input} type="number" step="0.01" value={patient.procalcitonin} onChange={e=>set('procalcitonin',e.target.value)} placeholder="optional"/>
          </div>
          <div>
            <label style={S.label}>Allergies</label>
            <input style={S.input} value={patient.allergies} onChange={e=>set('allergies',e.target.value)} placeholder="NKDA or list"/>
          </div>
          <div>
            <label style={S.label}>Additional Antibiotics</label>
            <input style={S.input} value={patient.additional_abx} onChange={e=>set('additional_abx',e.target.value)} placeholder="e.g. Zosyn 4.5g q8h"/>
          </div>
          {patient.mode==='HD'&&<div>
            <label style={S.label}>HD Schedule</label>
            <input style={S.input} value={patient.hd_schedule} onChange={e=>set('hd_schedule',e.target.value)} placeholder="e.g. MWF"/>
          </div>}
        </div>
        <div style={{marginTop:'10px'}}>
          <label style={S.label}>Cultures & Microbiology</label>
          <textarea style={{...S.input,minHeight:'60px',resize:'vertical'}} value={patient.cultures} onChange={e=>set('cultures',e.target.value)} placeholder="e.g. Blood cx 3/1: 2/2 MRSA (MIC 1.0), repeat 3/3: NGTD, Wound cx: MRSA"/>
        </div>
        <div style={{marginTop:'10px'}}>
          <label style={S.label}>Imaging & Diagnostics</label>
          <textarea style={{...S.input,minHeight:'60px',resize:'vertical'}} value={patient.imaging} onChange={e=>set('imaging',e.target.value)} placeholder="e.g. TTE: no vegetations, CXR: improved RLL infiltrate, MRI L-spine: epidural abscess"/>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// DOSING PANEL
// ═══════════════════════════════════════════════════════════
function DosingPanel({state, dispatch}) {
  const {patient} = state;
  const [doses, setDoses] = useState(state.current_encounter?.doses||[{dose_mg:1000,tinf_h:1,tau_h:12,start_h:0}]);
  const [levels, setLevels] = useState(state.current_encounter?.levels||[]);
  const [newDose, setNewDose] = useState({dose_mg:'',tinf_h:1,tau_h:12,start_h:''});
  const [newLevel, setNewLevel] = useState({t_abs:'',conc:'',label:'Trough'});
  const [firstDoseDt, setFirstDoseDt] = useState(state.patient.first_dose_dt||'');
  const [newDoseDateTime, setNewDoseDateTime] = useState({datetime:'',dose_mg:'',tinf_h:1,tau_h:12});
  const [newLevelDateTime, setNewLevelDateTime] = useState({datetime:'',conc:'',label:'Trough'});
  const [useTimeMode, setUseTimeMode] = useState(false); // false = hours mode, true = datetime mode
  const [newStartCalc, setNewStartCalc] = useState(null);
  const [ciTarget, setCiTarget] = useState(patient.ci_target_css||22);
  const [measCss, setMeasCss] = useState('');
  const [aiValidating, setAiValidating] = useState(false);

  // Clinical workflow state
  const [clinicalWorkflow, setClinicalWorkflow] = useState('steady_state'); // steady_state | not_ss | new_start | hd_monitoring
  const [levelStrategy, setLevelStrategy] = useState('trough_only'); // trough_only | peak_trough | random | pre_post_hd | two_random | multiple_days
  const [monitoringPhilosophy, setMonitoringPhilosophy] = useState('auc'); // auc | trough
  const [numDosesPrior, setNumDosesPrior] = useState(3);
  const [ssEstimated, setSsEstimated] = useState(true);

  // sync from loaded scenario
  useEffect(()=>{
    if(state.current_encounter?.doses) setDoses(state.current_encounter.doses);
    if(state.current_encounter?.levels) setLevels(state.current_encounter.levels);
  },[state.current_encounter]);

  // Auto-detect workflow from scenario
  useEffect(()=>{
    if (patient.mode==='HD') { setClinicalWorkflow('hd_monitoring'); setLevelStrategy('pre_post_hd'); }
    else if (patient.mode==='CI') setClinicalWorkflow('new_start');
  },[patient.mode]);

  const addDose=()=>{
    if(!newDose.dose_mg||newDose.start_h==='') return;
    setDoses([...doses,{...newDose,dose_mg:+newDose.dose_mg,start_h:+newDose.start_h,tinf_h:+newDose.tinf_h,tau_h:+newDose.tau_h}]);
    setNewDose({dose_mg:'',tinf_h:1,tau_h:12,start_h:''});
  };
  const addLevel=()=>{
    if(!newLevel.t_abs||!newLevel.conc) return;
    setLevels([...levels,{...newLevel,t_abs:+newLevel.t_abs,conc:+newLevel.conc}]);
    setNewLevel({t_abs:'',conc:'',label:'Trough'});
  };

  const runCalc=()=>{
    // Validation
    const valid=PK.validate(patient,doses,levels);
    if(valid.stops.length>0) {
      dispatch({type:'SET_ALERTS',payload:valid.stops.map((m,i)=>({id:`stop_${i}`,level:'DANGER',message:m}))});
      return;
    }

    const alerts=[];
    valid.warns.forEach((m,i)=>alerts.push({id:`warn_${i}`,level:'WARN',message:m}));

    // Build prior — use previous encounter posterior if available (Bayesian propagation)
    const popPrior=PK.populationPrior({...patient,crcl:patient.crcl||50});
    let prior = popPrior;
    const prevEnc = state.encounters.length > 0 ? state.encounters[state.encounters.length - 1] : null;
    if (prevEnc?.pk?.CL_post && prevEnc?.pk?.Vd_post) {
      prior = { ...popPrior, CL: prevEnc.pk.CL_post, Vd: prevEnc.pk.Vd_post };
      alerts.push({ id: 'propagated', level: 'INFO', message: `Bayesian prior propagated from encounter #${state.encounters.length}: CL=${prevEnc.pk.CL_post.toFixed(3)} L/h, Vd=${prevEnc.pk.Vd_post.toFixed(1)} L` });
    }

    let pk;
    if(levels.length>=1&&doses.length>=1) {
      pk=PK.bayesianMAP(prior,doses,levels);
    } else {
      pk={CL_post:prior.CL,Vd_post:prior.Vd,ke:prior.CL/prior.Vd,t_half:0.693/(prior.CL/prior.Vd),method:'population_prior'};
    }
    pk.method=levels.length>=1?'Bayesian MAP':'Population Prior';
    pk.model=prior.model;
    pk.CL_prior=prior.CL;
    pk.Vd_prior=prior.Vd;

    // Current regimen AUC
    let auc24=null;
    if(doses.length>0&&pk) {
      const lastDose=doses[doses.length-1];
      const {Cmax,Cmin}=PK.calcSteadyState(lastDose.dose_mg,lastDose.tinf_h,lastDose.tau_h,pk.CL_post,pk.Vd_post);
      auc24=PK.calcAUC24(Cmax,Cmin,pk.ke,lastDose.tinf_h,lastDose.tau_h);
    }

    // CI mode
    let ciRate=null;
    if(patient.mode==='CI') {
      ciRate={
        rate:(ciTarget*pk.CL_post).toFixed(1),
        daily:(ciTarget*pk.CL_post*24).toFixed(0),
        ld_low:Math.round(15*(patient.abw_kg||70)/250)*250,
        ld_high:Math.round(20*(patient.abw_kg||70)/250)*250,
        auc24:(ciTarget*24).toFixed(0),
        adjusted:measCss?((ciTarget/+measCss)*ciTarget*pk.CL_post).toFixed(1):null,
      };
    }

    // Dose recommendation
    const rec=PK.recommendDose(pk.CL_post,pk.Vd_post,500);
    const aucMic=auc24?(auc24/(patient.mic||1)):null;

    // AKI check
    let aki={stage:0};
    if(patient.scr&&(patient.scr_48h||patient.scr_7d)) {
      aki=PK.kdigo(+patient.scr,patient.scr_48h?+patient.scr_48h:undefined,patient.scr_7d?+patient.scr_7d:undefined);
    }
    if(aki.stage>=1) alerts.push({id:'aki',level:aki.stage>=2?'DANGER':'WARN',message:`KDIGO AKI Stage ${aki.stage}: ${aki.criteria}. Reassess vancomycin therapy.`});

    // AUC alerts
    if(auc24) {
      if(auc24>700) alerts.push({id:'auc_hi',level:'DANGER',message:`AUC24 ${auc24.toFixed(0)} mg·h/L markedly exceeds target (>700). Dose reduction required.`});
      else if(auc24>600) alerts.push({id:'auc_warn',level:'WARN',message:`AUC24 ${auc24.toFixed(0)} mg·h/L approaching nephrotoxicity threshold (>600).`});
      else if(auc24<400) alerts.push({id:'auc_low',level:'WARN',message:`AUC24 ${auc24.toFixed(0)} mg·h/L subtherapeutic (<400). Treatment failure risk.`});
    }

    // MIC alert
    if(patient.mic>1) alerts.push({id:'mic_hi',level:'WARN',message:`MIC ${patient.mic} mg/L — AUC/MIC target (≥400) unlikely achievable with conventional dosing. Consider alternative therapy.`});

    // Nephrotoxin alerts
    patient.nephrotoxins.forEach(k=>{
      const n=NEPHROTOXINS[k];
      alerts.push({id:`nep_${k}`,level:n.alert,message:`${n.name}: ${n.action}`});
    });

    // CrCl alerts
    if(patient.crcl&&patient.crcl>130) alerts.push({id:'arc',level:'INFO',message:'Augmented Renal Clearance (CrCl > 130 mL/min) — higher or more frequent doses may be needed.'});

    // Red Man Syndrome check
    if(doses.length>0) {
      const lastD=doses[doses.length-1];
      const ratePerMin=lastD.dose_mg/(lastD.tinf_h*60);
      if(ratePerMin>10) alerts.push({id:'rms',level:'WARN',message:`Infusion rate ${ratePerMin.toFixed(0)} mg/min exceeds 10 mg/min limit. Min infusion time: ${(lastD.dose_mg/600).toFixed(1)}h. Red Man Syndrome risk.`});
    }

    const encounter={
      id:Date.now(),
      timestamp:new Date().toISOString(),
      doses,levels,pk,
      auc24,aucMic,aki,rec,ciRate,
      alerts,
      scr_at_encounter: patient.scr ? +patient.scr : null,
      patient_snapshot: { name: patient.name, mode: patient.mode, age: patient.age, scr: patient.scr },
    };

    dispatch({type:'ADD_ENCOUNTER',payload:encounter});
    dispatch({type:'SET_ALERTS',payload:alerts});
    dispatch({type:'SET_UI',payload:{activeTab:'results'}});

    // Claude AI Smart Validation (async, non-blocking)
    if (getClaudeApiKey()) {
      setAiValidating(true);
      claudeSmartValidate(patient, doses, levels, pk, auc24).then(aiAlerts => {
        setAiValidating(false);
        if (aiAlerts && aiAlerts.length > 0) {
          dispatch({type:'SET_ALERTS', payload:[...alerts, ...aiAlerts]});
        }
      }).catch(() => setAiValidating(false));
    }
  };

  // Convert datetime string to hours from first dose
  const dtToHours = (dtStr) => {
    if(!firstDoseDt || !dtStr) return null;
    const ref = new Date(firstDoseDt);
    const dt = new Date(dtStr);
    if(isNaN(ref)||isNaN(dt)) return null;
    return (dt - ref) / 3600000; // ms → hours
  };
  // Convert hours from first dose to clock time string (e.g. "2030")
  const hoursToClockStr = (h) => {
    if(!firstDoseDt || h==null) return null;
    const dt = new Date(new Date(firstDoseDt).getTime() + h*3600000);
    if(isNaN(dt)) return null;
    return dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}).replace(':','');
  };
  // Convert hours to full datetime string
  const hoursToDateTime = (h) => {
    if(!firstDoseDt || h==null) return null;
    const dt = new Date(new Date(firstDoseDt).getTime() + h*3600000);
    if(isNaN(dt)) return null;
    return dt.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  };

  // Add dose via datetime
  const addDoseByTime = () => {
    if(!newDoseDateTime.dose_mg || !newDoseDateTime.datetime) return;
    const h = dtToHours(newDoseDateTime.datetime);
    if(h === null) { alert('Set first dose date/time first'); return; }
    setDoses([...doses, {dose_mg:+newDoseDateTime.dose_mg, tinf_h:+newDoseDateTime.tinf_h, tau_h:+newDoseDateTime.tau_h, start_h:Math.round(h*100)/100, _dt:newDoseDateTime.datetime}]);
    setNewDoseDateTime({datetime:'', dose_mg:'', tinf_h:1, tau_h:12});
  };
  // Add level via datetime
  const addLevelByTime = () => {
    if(!newLevelDateTime.conc || !newLevelDateTime.datetime) return;
    const h = dtToHours(newLevelDateTime.datetime);
    if(h === null) { alert('Set first dose date/time first'); return; }
    setLevels([...levels, {t_abs:Math.round(h*100)/100, conc:+newLevelDateTime.conc, label:newLevelDateTime.label, _dt:newLevelDateTime.datetime}]);
    setNewLevelDateTime({datetime:'', conc:'', label:'Trough'});
  };

  // New Start / Empiric dosing calculator
  const calcNewStart = () => {
    if(!patient.abw_kg || !patient.crcl) return;
    const abw = +patient.abw_kg;
    const ibw = patient.ibw_kg || PK.ibw(patient.sex, +patient.height_cm);
    const bmiVal = patient.bmi || PK.bmi(abw, +patient.height_cm);
    const dw = PK.crclWeight(abw, ibw, bmiVal); // HHS 2021 CrCl weight for maintenance
    const crcl = patient.crcl;
    const isObese = abw > 1.3 * ibw; // >130% IBW = obese per HHS

    // HHS 2021 Loading Dose:
    //  Non-obese (CrCl>30): 25-30 mg/kg ABW, max 3000 mg
    //  Obese (>130% IBW): 20-25 mg/kg ABW, max 3000 mg
    //  CrCl≤30 or RRT: 20 mg/kg ABW, max 2500 mg
    let ldMgPerKg;
    let ldMax;
    if(crcl <= 30 || patient.mode==='HD' || patient.mode==='CRRT') { ldMgPerKg=20; ldMax=2500; }
    else if(isObese) { ldMgPerKg=22; ldMax=3000; } // midpoint of 20-25
    else { ldMgPerKg=27; ldMax=3000; } // midpoint of 25-30
    const ldRaw = abw * ldMgPerKg;
    const ld = Math.min(Math.round(ldRaw/250)*250, ldMax);

    // Maintenance from CrCl-based interval (HHS 2021 / ASHP 2020)
    // Use population PK to back-calculate dose to hit AUC 400-600
    let tau, maintMgPerKg;
    if(crcl >= 90) { tau=8; maintMgPerKg=15; }
    else if(crcl >= 60) { tau=12; maintMgPerKg=15; }
    else if(crcl >= 40) { tau=24; maintMgPerKg=15; }
    else if(crcl >= 20) { tau=24; maintMgPerKg=10; }
    else { tau=48; maintMgPerKg=10; }
    let maint = Math.round(dw * maintMgPerKg / 250) * 250;
    maint = Math.min(Math.max(maint, 500), 3000);
    const tinf = PK.infusionTime(maint); // HHS 2021 infusion time table
    const ldTinf = PK.infusionTime(ld);

    const prior = PK.populationPrior({...patient, crcl});
    const ke = prior.CL/prior.Vd;
    const {Cmax,Cmin} = PK.calcSteadyState(maint, tinf, tau, prior.CL, prior.Vd);
    const estAUC = PK.calcAUC24(Cmax, Cmin, ke, tinf, tau);
    const ldMgKg = (ld/abw).toFixed(1);
    const maintMgKg = (maint/abw).toFixed(1);

    // HHS trough timing: q8-12h → before 4th-5th dose; q24h → before 3rd dose; >24h → before 2nd dose
    let troughDoseNum, troughHourOffset;
    if(tau <= 12) { troughDoseNum=4; troughHourOffset=tau*4-0.5; }
    else if(tau === 24) { troughDoseNum=3; troughHourOffset=tau*3-0.5; }
    else { troughDoseNum=2; troughHourOffset=tau*2-0.5; }
    const firstLevelTime = firstDoseDt ? hoursToDateTime(troughHourOffset) : `t=${troughHourOffset}h (before dose ${troughDoseNum})`;
    setNewStartCalc({ld, ldMgKg, ldTinf, maint, maintMgKg, tau, tinf, estAUC, Cmax, Cmin, firstLevelTime, troughDoseNum, isObese, ldMgPerKg});
  };

  const applyNewStart = (calc) => {
    const newDoses = [
      {dose_mg:calc.ld, tinf_h:calc.ldTinf||1.5, tau_h:calc.tau, start_h:0},
      {dose_mg:calc.maint, tinf_h:calc.tinf, tau_h:calc.tau, start_h:calc.tau},
      {dose_mg:calc.maint, tinf_h:calc.tinf, tau_h:calc.tau, start_h:calc.tau*2},
      {dose_mg:calc.maint, tinf_h:calc.tinf, tau_h:calc.tau, start_h:calc.tau*3},
    ];
    setDoses(newDoses);
    setNewStartCalc(null);
  };

  // Quick-fill helpers for common level strategies
  const quickFillLevels = (strategy) => {
    setLevelStrategy(strategy);
    // Clear existing levels for fresh quick-fill
    setLevels([]);
  };

  // Helper to auto-generate dose rows from a regimen
  const autoFillDoses = (dose, tau, tinf, count) => {
    const newDoses = [];
    for (let i = 0; i < count; i++) {
      newDoses.push({ dose_mg: dose, tau_h: tau, tinf_h: tinf, start_h: i * tau });
    }
    setDoses(newDoses);
  };

  // Estimated trough from population PK (if not at SS)
  const estimatedTrough = (() => {
    if (!patient.crcl || doses.length === 0) return null;
    try {
      const prior = PK.populationPrior({...patient, crcl: patient.crcl});
      const lastDose = doses[doses.length - 1];
      const ke = prior.CL / prior.Vd;
      const {Cmax, Cmin} = PK.calcSteadyState(lastDose.dose_mg, lastDose.tinf_h, lastDose.tau_h, prior.CL, prior.Vd);
      // If not at SS, estimate using number of doses given
      if (clinicalWorkflow === 'not_ss' && doses.length < 5) {
        const accumFactor = (1 - Math.exp(-ke * lastDose.tau_h * doses.length)) / (1 - Math.exp(-ke * lastDose.tau_h));
        return { estTrough: (Cmin * accumFactor).toFixed(1), ssTrough: Cmin.toFixed(1), ssAUC: ((Cmax + Cmin) / 2 * lastDose.tau_h * 24 / lastDose.tau_h).toFixed(0) };
      }
      return { ssTrough: Cmin.toFixed(1), ssAUC: null };
    } catch { return null; }
  })();

  return (
    <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
      {/* Clinical Workflow */}
      <div style={S.card}>
        <div style={{...S.h3,marginBottom:'14px'}}>Clinical Workflow</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
          {[
            {v:'steady_state',l:'At Steady State',desc:'≥4-5 doses given, routine monitoring'},
            {v:'not_ss',l:'Not at Steady State',desc:'Early therapy, accumulating'},
            {v:'new_start',l:'New Start / Empiric',desc:'Initial dosing, no levels yet'},
            {v:'hd_monitoring',l:'HD / CRRT Monitoring',desc:'Dialysis level monitoring'},
          ].map(w=>(
            <button key={w.v} onClick={()=>setClinicalWorkflow(w.v)} style={{
              padding:'10px',borderRadius:'8px',cursor:'pointer',textAlign:'left',
              background:clinicalWorkflow===w.v?'#0891b215':'#f8fafc',
              border:`1px solid ${clinicalWorkflow===w.v?'#0891b2':'#e2e8f0'}`,
              color:clinicalWorkflow===w.v?'#0891b2':'#64748b',transition:'all 0.15s',
            }}>
              <div style={{fontWeight:'700',fontSize:'12px'}}>{w.l}</div>
              <div style={{fontSize:'10px',marginTop:'2px',opacity:0.7}}>{w.desc}</div>
            </button>
          ))}
        </div>
      </div>

      {/* Monitoring Philosophy */}
      <div style={S.card}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'10px'}}>
          <div style={S.h3}>Monitoring Philosophy</div>
          <div style={{display:'flex',gap:'4px',background:'#f1f5f9',borderRadius:'8px',padding:'2px'}}>
            <button onClick={()=>setMonitoringPhilosophy('auc')} style={{
              padding:'6px 14px',borderRadius:'6px',border:'none',cursor:'pointer',fontSize:'12px',fontWeight:'700',
              background:monitoringPhilosophy==='auc'?'#0891b2':'transparent',
              color:monitoringPhilosophy==='auc'?'#fff':'#64748b',
            }}>AUC-Guided</button>
            <button onClick={()=>setMonitoringPhilosophy('trough')} style={{
              padding:'6px 14px',borderRadius:'6px',border:'none',cursor:'pointer',fontSize:'12px',fontWeight:'700',
              background:monitoringPhilosophy==='trough'?'#7c3aed':'transparent',
              color:monitoringPhilosophy==='trough'?'#fff':'#64748b',
            }}>Trough-Based</button>
          </div>
        </div>
        <div style={{fontSize:'12px',color:'#64748b',padding:'8px 12px',background:'#f8fafc',borderRadius:'6px',border:'1px solid #e2e8f0'}}>
          {monitoringPhilosophy==='auc' ? (
            <>
              <strong style={{color:'#0891b2'}}>AUC₂₄/MIC 400–600</strong> — 2020 guideline-recommended. Requires ≥1 level (ideally 2) for Bayesian estimation. More precise dosing, reduced nephrotoxicity vs trough-based approach. <em>Preferred for all patients.</em>
            </>
          ) : (
            <>
              <strong style={{color:'#7c3aed'}}>Trough 15–20 mg/L</strong> — Legacy approach. Simpler monitoring. Note: 2020 guidelines recommend transitioning to AUC-guided monitoring. Trough-only correlates poorly with AUC₂₄ in many patients. <em>Acceptable when AUC monitoring unavailable.</em>
            </>
          )}
        </div>
      </div>

      {/* Level Strategy */}
      <div style={S.card}>
        <div style={{...S.h3,marginBottom:'10px'}}>Level Strategy</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'6px',marginBottom:'12px'}}>
          {[
            {v:'trough_only',l:'Trough Only',show:true},
            {v:'peak_trough',l:'Peak + Trough',show:true},
            {v:'random',l:'Random Level',show:clinicalWorkflow==='not_ss'||true},
            {v:'pre_post_hd',l:'Pre/Post HD',show:patient.mode==='HD'||clinicalWorkflow==='hd_monitoring'},
            {v:'two_random',l:'Two Random Levels',show:clinicalWorkflow==='not_ss'||true},
            {v:'multiple_days',l:'Multi-Day Levels',show:true},
          ].filter(s=>s.show).map(s=>(
            <button key={s.v} onClick={()=>quickFillLevels(s.v)} style={{
              padding:'8px',borderRadius:'6px',cursor:'pointer',fontSize:'11px',fontWeight:'600',
              background:levelStrategy===s.v?'#d9770615':'#f8fafc',
              border:`1px solid ${levelStrategy===s.v?'#d97706':'#e2e8f0'}`,
              color:levelStrategy===s.v?'#d97706':'#64748b',
            }}>{s.l}</button>
          ))}
        </div>

        {/* Contextual guidance per strategy */}
        <div style={{fontSize:'11px',color:'#475569',padding:'6px 10px',background:'#fffbeb',borderRadius:'6px',border:'1px solid #fde68a',marginBottom:'12px'}}>
          {levelStrategy==='trough_only'&&'Draw trough 30 min before next dose (at steady state, typically before 4th or 5th dose). Enter the trough concentration and the time in hours from first dose.'}
          {levelStrategy==='peak_trough'&&'Draw peak 1–2h after end of infusion, trough 30 min before next dose. Two levels enable precise Bayesian PK estimation (Sawchuk-Zaske).'}
          {levelStrategy==='random'&&'Any level drawn at a known time post-dose. Bayesian estimation will extrapolate to estimate trough and AUC. Best with population PK prior.'}
          {levelStrategy==='pre_post_hd'&&'Pre-HD: Draw immediately before dialysis. Post-HD: Draw 30 min after dialysis completion (allow redistribution). Used to calculate HD clearance.'}
          {levelStrategy==='two_random'&&'Two levels at different times (not SS). Allows direct calculation of ke and Vd without relying heavily on population priors. Ideal for accumulation assessment.'}
          {levelStrategy==='multiple_days'&&'Levels from different dosing days. Useful for assessing accumulation trend, non-linear kinetics, or changing renal function over time.'}
        </div>
      </div>

      {/* CI Rate Calculator */}
      {patient.mode==='CI'&&(
        <div style={S.card}>
          <div style={{...S.h3,marginBottom:'14px'}}>Continuous Infusion Calculator</div>
          <div className='ad-grid-2' style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'12px'}}>
            <div>
              <label style={S.label}>Target Css (mg/L)</label>
              <input style={S.input} type="number" value={ciTarget} onChange={e=>setCiTarget(+e.target.value)} placeholder="20–25"/>
            </div>
            <div>
              <label style={S.label}>Measured Css (for adjustment)</label>
              <input style={S.input} type="number" value={measCss} onChange={e=>setMeasCss(e.target.value)} placeholder="optional"/>
            </div>
          </div>
          {patient.crcl&&(()=>{
            const prior=PK.populationPrior({...patient,crcl:patient.crcl});
            const rate=ciTarget*prior.CL;
            return (
              <div style={{background:'#f8fafc',borderRadius:'8px',padding:'12px'}}>
                <div className='ad-grid-3' style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',fontSize:'12px'}}>
                  <div><div style={S.label}>Loading Dose</div><div style={{...S.mono,...S.cyan,fontSize:'15px',fontWeight:'700'}}>{Math.round(15*(+patient.abw_kg||70)/250)*250}–{Math.round(20*(+patient.abw_kg||70)/250)*250} mg</div></div>
                  <div><div style={S.label}>CI Rate</div><div style={{...S.mono,...S.cyan,fontSize:'15px',fontWeight:'700'}}>{rate.toFixed(1)} mg/h</div></div>
                  <div><div style={S.label}>AUC₂₄</div><div style={{...S.mono,...S.green,fontSize:'15px',fontWeight:'700'}}>{(ciTarget*24).toFixed(0)} mg·h/L</div></div>
                </div>
                {measCss&&<div style={{marginTop:'8px',fontSize:'12px',color:'#7c3aed'}}>Adjusted rate: {((ciTarget/+measCss)*rate).toFixed(1)} mg/h → Css {ciTarget} mg/L</div>}
              </div>
            );
          })()}
        </div>
      )}

      {/* New Start / Empiric Panel */}
      {clinicalWorkflow==='new_start'&&(
        <div style={{...S.card,border:'1.5px solid #0891b240',background:'#f0f9ff'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
            <div style={S.h2}>New Start / Empiric Dosing</div>
            <span style={{fontSize:'10px',color:'#0369a1',background:'#bae6fd',padding:'2px 8px',borderRadius:'10px'}}>Requires CrCl</span>
          </div>
          {(!patient.abw_kg||!patient.crcl)&&(
            <div style={{padding:'10px',background:'#fffbeb',borderRadius:'6px',border:'1px solid #fde68a',fontSize:'12px',color:'#92400e',marginBottom:'10px'}}>
              Enter weight, height, sex, age, and SCr on the Patient tab to enable empiric dosing calculator.
            </div>
          )}
          {patient.abw_kg&&patient.crcl&&(
            <div>
              <button onClick={calcNewStart} style={{...S.btnPrimary,padding:'10px 24px',marginBottom:'12px'}}>
                ⚡ Calculate Loading + Maintenance
              </button>
              {newStartCalc&&(
                <div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'10px',marginBottom:'12px'}}>
                    <div style={{background:'#ffffff',borderRadius:'10px',padding:'12px',border:'1px solid #bae6fd',textAlign:'center'}}>
                      <div style={S.label}>Loading Dose</div>
                      <div style={{...S.mono,color:'#0891b2',fontSize:'18px',fontWeight:'800'}}>{newStartCalc.ld} mg</div>
                      <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'2px'}}>{newStartCalc.ldMgKg} mg/kg ABW · Infuse over {newStartCalc.ldTinf||1.5}h</div>
                      <div style={{fontSize:'10px',color:'#7c3aed',marginTop:'1px'}}>{newStartCalc.isObese?'Obese: 20-25 mg/kg':'Non-obese: 25-30 mg/kg'}</div>
                    </div>
                    <div style={{background:'#ffffff',borderRadius:'10px',padding:'12px',border:'1px solid #bae6fd',textAlign:'center'}}>
                      <div style={S.label}>Maintenance</div>
                      <div style={{...S.mono,color:'#0891b2',fontSize:'18px',fontWeight:'800'}}>{newStartCalc.maint} mg q{newStartCalc.tau}h</div>
                      <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'2px'}}>{newStartCalc.maintMgKg} mg/kg · Infuse over {newStartCalc.tinf}h</div>
                    </div>
                    <div style={{background:'#ffffff',borderRadius:'10px',padding:'12px',border:'1px solid #bae6fd',textAlign:'center'}}>
                      <div style={S.label}>Est. SS AUC₂₄</div>
                      <div style={{...S.mono,color:newStartCalc.estAUC>=400&&newStartCalc.estAUC<=600?'#059669':'#d97706',fontSize:'18px',fontWeight:'800'}}>{newStartCalc.estAUC.toFixed(0)}</div>
                      <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'2px'}}>Pred Trough: {newStartCalc.Cmin.toFixed(1)} mg/L</div>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:'8px',alignItems:'center',padding:'8px 12px',background:'#f0fdf4',borderRadius:'8px',border:'1px solid #bbf7d0',marginBottom:'10px'}}>
                    <span style={{fontSize:'12px',color:'#166534'}}>📅 HHS trough timing: Draw level <strong>{newStartCalc.firstLevelTime}</strong> (trough before dose {newStartCalc.troughDoseNum||5})</span>
                  </div>
                  <button onClick={()=>applyNewStart(newStartCalc)} style={{...S.btnPrimary,width:'100%',padding:'10px',fontSize:'13px'}}>
                    ✓ Apply This Regimen to Dosing History
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* Dosing History — Time-Based */}
      <div style={S.card}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div style={S.h3}>Dosing History</div>
          <div style={{display:'flex',gap:'6px',alignItems:'center'}}>
            <div style={{display:'flex',background:'#f1f5f9',borderRadius:'8px',padding:'2px',gap:'1px'}}>
              <button onClick={()=>setUseTimeMode(false)} style={{padding:'4px 10px',borderRadius:'6px',border:'none',cursor:'pointer',fontSize:'11px',fontWeight:'600',background:!useTimeMode?'#0891b2':'transparent',color:!useTimeMode?'#fff':'#64748b'}}>⏱ Hours</button>
              <button onClick={()=>setUseTimeMode(true)} style={{padding:'4px 10px',borderRadius:'6px',border:'none',cursor:'pointer',fontSize:'11px',fontWeight:'600',background:useTimeMode?'#0891b2':'transparent',color:useTimeMode?'#fff':'#64748b'}}>🗓 Date/Time</button>
            </div>
          </div>
        </div>

        {/* Quick-fill buttons */}
        <div style={{display:'flex',gap:'4px',flexWrap:'wrap',marginBottom:'10px'}}>
          {[
            {label:'1g q12h ×3',dose:1000,tau:12,tinf:1,count:3},
            {label:'1.5g q12h ×3',dose:1500,tau:12,tinf:1.5,count:3},
            {label:'1.25g q8h ×4',dose:1250,tau:8,tinf:1,count:4},
            {label:'750mg q12h ×3',dose:750,tau:12,tinf:1,count:3},
          ].map((qf,i)=>(
            <button key={i} onClick={()=>autoFillDoses(qf.dose,qf.tau,qf.tinf,qf.count)} style={{
              padding:'4px 9px',borderRadius:'20px',border:'1px solid #e2e8f0',background:'#f8fafc',
              cursor:'pointer',fontSize:'10px',color:'#64748b',whiteSpace:'nowrap',
            }}>{qf.label}</button>
          ))}
        </div>

        {/* First dose reference time (for datetime mode) */}
        {useTimeMode&&(
          <div style={{padding:'10px 12px',background:'#fffbeb',borderRadius:'8px',border:'1px solid #fde68a',marginBottom:'10px'}}>
            <label style={{...S.label,color:'#92400e'}}>First Dose Date & Time (reference)</label>
            <input type="datetime-local" value={firstDoseDt}
              onChange={e=>{setFirstDoseDt(e.target.value); dispatch({type:'SET_PATIENT',payload:{first_dose_dt:e.target.value}});}}
              style={{...S.input,fontFamily:"inherit",marginTop:'4px'}}/>
            <div style={{fontSize:'10px',color:'#92400e',marginTop:'4px'}}>All dose/level times will be converted to hours from this reference.</div>
          </div>
        )}

        {/* Doses list */}
        {doses.length===0&&<div style={{...S.muted,fontSize:'13px',marginBottom:'8px',textAlign:'center',padding:'16px'}}>No doses added yet</div>}
        {doses.map((d,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'6px',background:'#f1f5f9',borderRadius:'8px',padding:'8px 12px',fontSize:'13px'}}>
            <div style={{display:'flex',flexDirection:'column',minWidth:'22px',alignItems:'center'}}>
              <span style={{...S.mono,color:'#94a3b8',fontSize:'10px'}}>#{i+1}</span>
            </div>
            <div style={{flex:1}}>
              <div style={{...S.mono}}><span style={S.cyan}>{d.dose_mg} mg</span> q{d.tau_h}h × {d.tinf_h}h</div>
              <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'2px'}}>
                {firstDoseDt&&useTimeMode
                  ? <>🕐 {hoursToDateTime(d.start_h)} <span style={{color:'#cbd5e1'}}>({d.start_h}h)</span></>
                  : <>t₀ = {d.start_h}h {firstDoseDt&&<span style={{color:'#94a3b8'}}>({hoursToClockStr(d.start_h)})</span>}</>
                }
              </div>
            </div>
            <div style={{fontSize:'11px',color:'#64748b',fontFamily:'monospace'}}>{(d.dose_mg/(patient.abw_kg||1)).toFixed(1)} mg/kg</div>
            <button onClick={()=>setDoses(doses.filter((_,j)=>j!==i))} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:'18px',lineHeight:'1',padding:'0 2px'}}>×</button>
          </div>
        ))}

        {/* Add dose row */}
        {useTimeMode ? (
          <div style={{marginTop:'8px',display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr auto',gap:'6px',alignItems:'end'}}>
            <div><label style={S.label}>Date & Time of Dose</label><input type="datetime-local" value={newDoseDateTime.datetime} onChange={e=>setNewDoseDateTime({...newDoseDateTime,datetime:e.target.value})} style={{...S.inputSm,fontFamily:'inherit'}}/></div>
            <div><label style={S.label}>Dose (mg)</label><input style={S.inputSm} type="number" value={newDoseDateTime.dose_mg} onChange={e=>setNewDoseDateTime({...newDoseDateTime,dose_mg:e.target.value})} placeholder="1000"/></div>
            <div><label style={S.label}>Interval (h)</label><input style={S.inputSm} type="number" value={newDoseDateTime.tau_h} onChange={e=>setNewDoseDateTime({...newDoseDateTime,tau_h:+e.target.value})} placeholder="12"/></div>
            <div><label style={S.label}>Infusion (h)</label><input style={S.inputSm} type="number" value={newDoseDateTime.tinf_h} onChange={e=>setNewDoseDateTime({...newDoseDateTime,tinf_h:+e.target.value})} placeholder="1"/></div>
            <button onClick={addDoseByTime} style={{...S.btnPrimary,padding:'6px 14px',fontSize:'20px',alignSelf:'flex-end'}}>+</button>
          </div>
        ) : (
          <div style={{marginTop:'8px',display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr auto',gap:'6px',alignItems:'end'}}>
            <div><label style={S.label}>Dose (mg)</label><input style={S.inputSm} type="number" value={newDose.dose_mg} onChange={e=>setNewDose({...newDose,dose_mg:e.target.value})} placeholder="1000"/></div>
            <div><label style={S.label}>Interval (h)</label><input style={S.inputSm} type="number" value={newDose.tau_h} onChange={e=>setNewDose({...newDose,tau_h:+e.target.value})} placeholder="12"/></div>
            <div><label style={S.label}>Infusion (h)</label><input style={S.inputSm} type="number" value={newDose.tinf_h} onChange={e=>setNewDose({...newDose,tinf_h:+e.target.value})} placeholder="1"/></div>
            <div><label style={S.label}>Start (h from #1)</label><input style={S.inputSm} type="number" value={newDose.start_h} onChange={e=>setNewDose({...newDose,start_h:e.target.value})} placeholder="0"/></div>
            <button onClick={addDose} style={{...S.btnPrimary,padding:'6px 14px',fontSize:'20px',alignSelf:'flex-end'}}>+</button>
          </div>
        )}

        {/* Estimated trough/AUC preview */}
        {estimatedTrough && (
          <div style={{marginTop:'10px',padding:'10px 12px',background:'#f0f9ff',borderRadius:'8px',border:'1px solid #bae6fd',fontSize:'12px'}}>
            <div style={{fontWeight:'700',color:'#0369a1',marginBottom:'4px'}}>Population Estimate (before levels)</div>
            <div style={{display:'flex',gap:'16px',flexWrap:'wrap'}}>
              <span>Est. SS Trough: <strong style={{color:+estimatedTrough.ssTrough>20?'#dc2626':+estimatedTrough.ssTrough<10?'#d97706':'#059669'}}>{estimatedTrough.ssTrough} mg/L</strong></span>
              {estimatedTrough.estTrough && <span>Current Trough (non-SS): <strong style={{color:'#7c3aed'}}>{estimatedTrough.estTrough} mg/L</strong></span>}
              {estimatedTrough.ssAUC && <span>Est. SS AUC₂₄: <strong>{estimatedTrough.ssAUC} mg·h/L</strong></span>}
            </div>
          </div>
        )}
      </div>

      {/* Observed Levels */}
      <div style={S.card}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div style={S.h3}>Observed Drug Levels</div>
        </div>
        {levels.length===0&&(
          <div style={{...S.muted,fontSize:'13px',marginBottom:'8px',padding:'10px',textAlign:'center'}}>
            {clinicalWorkflow==='new_start' ? 'No levels yet — analysis will use population prior estimates only' : 'No levels entered — add observed concentrations below'}
          </div>
        )}
        {levels.map((l,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'6px',background:'#fffbeb',borderRadius:'8px',padding:'8px 12px',fontSize:'13px',border:'1px solid #fde68a40'}}>
            <span style={{background:'#d97706',color:'#fff',borderRadius:'6px',padding:'2px 8px',fontSize:'11px',fontWeight:'700',minWidth:'55px',textAlign:'center'}}>{l.label}</span>
            <span style={{...S.mono,flex:1}}><span style={{color:'#d97706',fontWeight:'700'}}>{l.conc}</span> mg/L</span>
            <span style={{...S.mono,...S.muted,fontSize:'12px'}}>
              t={l.t_abs}h
              {firstDoseDt&&<span style={{color:'#d97706',marginLeft:'6px'}}>({hoursToDateTime(l.t_abs)||''})</span>}
            </span>
            <button onClick={()=>setLevels(levels.filter((_,j)=>j!==i))} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:'18px',lineHeight:'1',padding:'0 2px'}}>×</button>
          </div>
        ))}

        {/* Add level row */}
        {useTimeMode ? (
          <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr auto',gap:'6px',marginTop:'8px',alignItems:'end'}}>
            <div><label style={S.label}>Date & Time of Level Draw</label><input type="datetime-local" value={newLevelDateTime.datetime} onChange={e=>setNewLevelDateTime({...newLevelDateTime,datetime:e.target.value})} style={{...S.inputSm,fontFamily:'inherit'}}/></div>
            <div><label style={S.label}>Type</label>
              <select style={{...S.select,padding:'6px 10px',fontSize:'13px'}} value={newLevelDateTime.label} onChange={e=>setNewLevelDateTime({...newLevelDateTime,label:e.target.value})}>
                {['Trough','Peak','Random','Pre-HD','Post-HD','Day 1','Day 2','Day 3'].map(l=><option key={l}>{l}</option>)}
              </select>
            </div>
            <div><label style={S.label}>Conc (mg/L)</label><input style={S.inputSm} type="number" value={newLevelDateTime.conc} onChange={e=>setNewLevelDateTime({...newLevelDateTime,conc:e.target.value})} placeholder="12.5"/></div>
            <button onClick={addLevelByTime} style={{...S.btnPrimary,padding:'6px 14px',fontSize:'20px',alignSelf:'flex-end'}}>+</button>
          </div>
        ) : (
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr auto',gap:'6px',marginTop:'8px',alignItems:'end'}}>
            <div><label style={S.label}>Type</label>
              <select style={{...S.select,padding:'6px 10px',fontSize:'13px'}} value={newLevel.label} onChange={e=>setNewLevel({...newLevel,label:e.target.value})}>
                {(levelStrategy==='pre_post_hd'?['Pre-HD','Post-HD','Random']:['Trough','Peak','Random','Pre-HD','Post-HD','Day 1','Day 2','Day 3']).map(l=><option key={l}>{l}</option>)}
              </select>
            </div>
            <div><label style={S.label}>Conc (mg/L)</label><input style={S.inputSm} type="number" value={newLevel.conc} onChange={e=>setNewLevel({...newLevel,conc:e.target.value})} placeholder="12.5"/></div>
            <div><label style={S.label}>Hours from 1st dose</label><input style={S.inputSm} type="number" value={newLevel.t_abs} onChange={e=>setNewLevel({...newLevel,t_abs:e.target.value})} placeholder="23.5"/></div>
            <button onClick={addLevel} style={{...S.btnPrimary,padding:'6px 14px',fontSize:'20px',alignSelf:'flex-end'}}>+</button>
          </div>
        )}
        <div style={{marginTop:'8px',fontSize:'11px',color:'#475569'}}>
          {useTimeMode ? 'Set first dose date/time above to auto-convert clock times → hours. Switch to Hours mode anytime.' : 'Hours from first dose start. q12h trough ≈ t=11.5h from last dose; peak ≈ t=2h post-infusion end. Switch to Date/Time mode for easier entry.'}
        </div>
      </div>

      <button onClick={runCalc} style={{...S.btnPrimary,padding:'14px',fontSize:'15px',fontWeight:'800',letterSpacing:'0.04em',textAlign:'center'}}>
        ▶ RUN {monitoringPhilosophy==='auc'?'AUC-GUIDED':'TROUGH-BASED'} BAYESIAN ANALYSIS
      </button>
      {aiValidating && (
        <div style={{textAlign:'center',padding:'8px',fontSize:'12px',color:'#0891b2',animation:'pulse 1.5s infinite'}}>
          🤖 Claude AI validating clinical plausibility...
        </div>
      )}
      {getClaudeApiKey() && !aiValidating && (
        <div style={{textAlign:'center',fontSize:'11px',color:'#94a3b8',marginTop:'4px'}}>
          🤖 AI Smart Validation enabled
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// RESULTS PANEL
// ═══════════════════════════════════════════════════════════
function ResultsPanel({state, dispatch}) {
  // Hooks must be called before any conditional return
  const [targetMode, setTargetMode] = useState('auc');       // 'auc' | 'trough'
  const [aucTarget, setAucTarget] = useState(500);
  const [troughTarget, setTroughTarget] = useState(null);    // null → use inf midpoint
  const [altDose, setAltDose] = useState(null);
  const [altTau, setAltTau] = useState(null);
  const [showTinker, setShowTinker] = useState(false);

  const enc=state.current_encounter;
  if(!enc?.pk) return (
    <div style={{...S.card,textAlign:'center',padding:'48px'}}>
      <div style={{fontSize:'32px',marginBottom:'12px'}}>⚕</div>
      <div style={{...S.h2,color:'#64748b'}}>No calculation yet</div>
      <div style={{...S.muted,fontSize:'13px',marginTop:'8px'}}>Enter patient data and run analysis</div>
    </div>
  );

  const {pk, auc24, aucMic, aki, rec, ciRate, doses, levels} = enc;
  const grade='A-II';

  // Infection targets
  const infType = INFECTION_TYPES_DB[state.patient.infection_type] || INFECTION_TYPES_DB.other;
  const troughMidpoint = Math.round((infType.troughLow + infType.troughHigh) / 2);
  const activeTroughTarget = troughTarget ?? troughMidpoint;
  const activeTroughTau = altTau || 12;

  // Live recommendation computed from current target selection
  let recLive = rec;
  try {
    if(targetMode === 'auc') {
      recLive = PK.recommendDose(pk.CL_post, pk.Vd_post, aucTarget);
    } else {
      recLive = PK.recommendByTrough(pk.CL_post, pk.Vd_post, activeTroughTarget, activeTroughTau);
    }
  } catch(e) { recLive = rec; }

  // Alternate regimen (tinkered by user)
  const computedAlt = (showTinker && altDose && altTau) ? (() => {
    try {
      const ke = pk.CL_post / pk.Vd_post;
      const tinf = PK.infusionTime(+altDose);
      const {Cmax, Cmin} = PK.calcSteadyState(+altDose, tinf, +altTau, pk.CL_post, pk.Vd_post);
      const predAUC = PK.calcAUC24(Cmax, Cmin, ke, tinf, +altTau);
      return {dose:+altDose, tau:+altTau, tinf, predAUC, Cmax, Cmin,
              daily_dose:(+altDose)*(24/(+altTau)),
              aucMic: predAUC/(state.patient.mic||1)};
    } catch { return null; }
  })() : null;

  return (
    <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
      {/* AUC Overview */}
      <div style={{...S.card,display:'flex',gap:'24px',alignItems:'center',flexWrap:'wrap'}}>
        <AUCGauge auc={auc24}/>
        <div style={{flex:1,minWidth:'200px'}}>
          <div style={{...S.h2,marginBottom:'12px'}}>PK Results</div>
          <div className='ad-grid-2' style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
            {[
              {l:'Method',v:pk.method,c:'#64748b'},
              {l:'Model',v:pk.model,c:'#64748b'},
              {l:'CL (post)',v:`${pk.CL_post.toFixed(3)} L/h`,c:'#0891b2'},
              {l:'Vd (post)',v:`${pk.Vd_post.toFixed(1)} L`,c:'#0891b2'},
              {l:'Ke',v:`${pk.ke.toFixed(4)} h⁻¹`,c:'#7c3aed'},
              {l:'t½',v:`${pk.t_half.toFixed(1)} h`,c:'#7c3aed'},
              {l:'AUC/MIC',v:aucMic?`${aucMic.toFixed(0)} (MIC ${state.patient.mic})`:'-',c:aucMic&&aucMic>=400?'#059669':'#dc2626'},
            ].map(({l,v,c})=>(
              <div key={l}>
                <div style={{...S.label,marginBottom:'2px'}}>{l}</div>
                <div style={{...S.mono,fontSize:'13px',color:c,fontWeight:'600'}}>{v}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Dose Recommendation — interactive */}
      {recLive&&(()=>{
        const lastDose = doses[doses.length-1];
        let currTrough = null;
        if(lastDose && pk) {
          const {Cmin} = PK.calcSteadyState(lastDose.dose_mg,lastDose.tinf_h,lastDose.tau_h,pk.CL_post,pk.Vd_post);
          currTrough = Cmin;
        }
        let nextDoseInfo = null;
        if(state.patient.first_dose_dt && lastDose) {
          try {
            const lastDoseStart = new Date(new Date(state.patient.first_dose_dt).getTime() + lastDose.start_h*3600000);
            const nextDoseTime = new Date(lastDoseStart.getTime() + recLive.tau*3600000);
            nextDoseInfo = nextDoseTime.toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
          } catch {}
        }
        const abw = +state.patient.abw_kg || null;
        const inf = infType;

        // Small button styles
        const btnTab = (active) => ({padding:'5px 14px',borderRadius:'6px',cursor:'pointer',fontSize:'12px',fontWeight:'600',border:'none',
          background:active?'#0891b2':'#e2e8f0',color:active?'#ffffff':'#64748b',transition:'all 0.15s'});
        const btnInterval = (active) => ({padding:'4px 10px',borderRadius:'5px',cursor:'pointer',fontSize:'11px',fontWeight:'600',border:'none',
          background:active?'#7c3aed':'#f1f5f9',color:active?'#ffffff':'#64748b'});

        // In-range check helper
        const inRange = (val, lo, hi) => val >= lo && val <= hi;
        const rangeColor = (val, lo, hi) => val < lo ? '#dc2626' : val > hi ? '#d97706' : '#059669';

        return (
        <div style={{...S.card,borderColor:'#00d4ff40'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'14px'}}>
            <div style={S.h2}>Dose Recommendation</div>
            <span style={{fontSize:'11px',background:'#f59e0b25',color:'#d97706',padding:'2px 8px',borderRadius:'12px',border:'1px solid #f59e0b40'}}>{grade}</span>
          </div>

          {/* Current metrics hero row */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'12px',marginBottom:'14px'}}>
            <div style={{background:'#f8fafc',borderRadius:'10px',padding:'12px',border:`1px solid ${auc24&&!inRange(auc24,inf.aucLow,inf.aucHigh)?'#f59e0b':'#e2e8f0'}`}}>
              <div style={S.label}>Current AUC₂₄</div>
              <div style={{...S.mono,fontSize:'20px',fontWeight:'800',color:auc24?rangeColor(auc24,inf.aucLow,inf.aucHigh):'#94a3b8'}}>{auc24?.toFixed(0)||'—'}</div>
              <div style={{fontSize:'10px',color:'#64748b',marginTop:'2px'}}>Target {inf.aucLow}–{inf.aucHigh} mg·h/L</div>
            </div>
            <div style={{background:'#f8fafc',borderRadius:'10px',padding:'12px',border:`1px solid ${currTrough!=null&&!inRange(currTrough,inf.troughLow,inf.troughHigh)?'#f59e0b':'#e2e8f0'}`}}>
              <div style={S.label}>SS Trough (current)</div>
              <div style={{...S.mono,fontSize:'20px',fontWeight:'800',color:currTrough==null?'#94a3b8':rangeColor(currTrough,inf.troughLow,inf.troughHigh)}}>{currTrough!=null?currTrough.toFixed(1):'—'}</div>
              <div style={{fontSize:'10px',color:'#64748b',marginTop:'2px'}}>Target {inf.troughLow}–{inf.troughHigh} mg/L</div>
            </div>
            <div style={{background:'#f8fafc',borderRadius:'10px',padding:'12px'}}>
              <div style={S.label}>AUC/MIC</div>
              <div style={{...S.mono,fontSize:'20px',fontWeight:'800',color:aucMic&&aucMic>=400?'#059669':'#dc2626'}}>{aucMic?aucMic.toFixed(0):'—'}</div>
              <div style={{fontSize:'10px',color:'#64748b',marginTop:'2px'}}>Target ≥ 400 (MIC {state.patient.mic})</div>
            </div>
          </div>

          {/* ── TARGET SELECTOR ── */}
          <div style={{background:'#f8fafc',borderRadius:'10px',padding:'12px',border:'1px solid #e2e8f0',marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px',flexWrap:'wrap'}}>
              <span style={{...S.label,margin:0}}>Optimization target:</span>
              <button onClick={()=>setTargetMode('auc')} style={btnTab(targetMode==='auc')}>AUC/MIC</button>
              <button onClick={()=>setTargetMode('trough')} style={btnTab(targetMode==='trough')}>Trough</button>
            </div>

            {targetMode==='auc'?(
              <div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px'}}>
                  <span style={{...S.label,margin:0}}>AUC₂₄ target</span>
                  <span style={{...S.mono,color:'#0891b2',fontWeight:'700',fontSize:'15px'}}>{aucTarget} <span style={{fontSize:'11px',color:'#64748b'}}>mg·h/L</span></span>
                </div>
                <input type="range" min="400" max="600" step="25" value={aucTarget}
                  onChange={e=>setAucTarget(+e.target.value)}
                  style={{width:'100%',accentColor:'#0891b2'}}/>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:'10px',color:'#94a3b8',marginTop:'2px'}}>
                  {[400,425,450,475,500,525,550,575,600].map(v=><span key={v}>{v}</span>)}
                </div>
              </div>
            ):(
              <div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px'}}>
                  <span style={{...S.label,margin:0}}>Trough target</span>
                  <span style={{...S.mono,color:'#0891b2',fontWeight:'700',fontSize:'15px'}}>{activeTroughTarget} <span style={{fontSize:'11px',color:'#64748b'}}>mg/L</span></span>
                </div>
                <input type="range" min={inf.troughLow} max={inf.troughHigh} step="1" value={activeTroughTarget}
                  onChange={e=>setTroughTarget(+e.target.value)}
                  style={{width:'100%',accentColor:'#0891b2'}}/>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:'10px',color:'#94a3b8',marginTop:'2px'}}>
                  <span>{inf.troughLow} mg/L</span><span>{inf.troughHigh} mg/L</span>
                </div>
                <div style={{marginTop:'8px',display:'flex',gap:'5px',alignItems:'center',flexWrap:'wrap'}}>
                  <span style={{...S.label,margin:0,fontSize:'11px'}}>Interval:</span>
                  {[8,12,24,36,48].map(t=>(
                    <button key={t} onClick={()=>setAltTau(t)} style={btnInterval(activeTroughTau===t&&targetMode==='trough')}>q{t}h</button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Recommended regimen box */}
          <div style={{background:'linear-gradient(135deg,#f0f9ff,#e0f2fe)',borderRadius:'12px',padding:'14px 16px',border:'1.5px solid #0891b240',marginBottom:'10px'}}>
            <div style={{fontSize:'11px',color:'#0369a1',fontWeight:'700',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:'6px'}}>
              Recommended Regimen · {targetMode==='auc'?`AUC target ${aucTarget}`:`Trough target ${activeTroughTarget} mg/L`}
            </div>
            <div style={{display:'flex',alignItems:'baseline',gap:'12px',flexWrap:'wrap'}}>
              <div style={{...S.mono,fontSize:'22px',fontWeight:'800',color:'#0891b2'}}>{recLive.dose} mg q{recLive.tau}h</div>
              <div style={{fontSize:'13px',color:'#0369a1'}}>× {recLive.tinf}h infusion</div>
              {abw&&<div style={{fontSize:'13px',color:'#64748b',fontFamily:'monospace'}}>({(recLive.dose/abw).toFixed(1)} mg/kg)</div>}
            </div>
            {nextDoseInfo&&(
              <div style={{marginTop:'8px',padding:'6px 10px',background:'rgba(8,145,178,0.08)',borderRadius:'6px',fontSize:'12px',color:'#0369a1',display:'flex',alignItems:'center',gap:'6px'}}>
                <span>🕐</span><span>Give next dose: <strong>{nextDoseInfo}</strong></span>
              </div>
            )}
          </div>

          {/* Predicted values grid */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px',marginBottom:'12px'}}>
            {[
              {l:'Pred. AUC₂₄',   v:`${recLive.predAUC.toFixed(0)} mg·h/L`, c:rangeColor(recLive.predAUC,inf.aucLow,inf.aucHigh)},
              {l:'Pred. Trough',   v:`${recLive.Cmin.toFixed(1)} mg/L`,       c:rangeColor(recLive.Cmin,inf.troughLow,inf.troughHigh)},
              {l:'Pred. Peak',     v:`${recLive.Cmax.toFixed(1)} mg/L`,       c:'#7c3aed'},
              {l:'Daily Dose',     v:`${recLive.daily_dose.toFixed(0)} mg${abw?` / ${(recLive.daily_dose/abw).toFixed(1)} mg/kg`:''}`, c:'#64748b'},
            ].map(({l,v,c})=>(
              <div key={l} style={{background:'#f8fafc',borderRadius:'8px',padding:'8px 10px'}}>
                <div style={{...S.label,marginBottom:'4px'}}>{l}</div>
                <div style={{...S.mono,fontSize:'13px',fontWeight:'700',color:c}}>{v}</div>
              </div>
            ))}
          </div>

          {/* ── ALTERNATE REGIMEN TINKERER ── */}
          <div style={{borderTop:'1px solid #e2e8f0',paddingTop:'12px'}}>
            <button
              onClick={()=>{
                const next=!showTinker;
                setShowTinker(next);
                if(next){setAltDose(altDose||recLive.dose);setAltTau(altTau||recLive.tau);}
              }}
              style={{background:'none',border:'1px solid #e2e8f0',borderRadius:'8px',padding:'7px 14px',cursor:'pointer',fontSize:'12px',color:'#64748b',fontWeight:'600',display:'flex',alignItems:'center',gap:'6px'}}>
              <span>{showTinker?'▲':'⚗'}</span>
              <span>{showTinker?'Hide Alternate Regimen':'Try Alternate Regimen'}</span>
            </button>

            {showTinker&&(
              <div style={{marginTop:'12px'}}>
                {/* Controls */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'12px'}}>
                  <div>
                    <label style={S.label}>Alternate dose</label>
                    <select value={altDose||''} onChange={e=>setAltDose(+e.target.value)} style={{...S.select,marginTop:'4px'}}>
                      {[250,500,750,1000,1250,1500,1750,2000,2250,2500,2750,3000].map(d=>(
                        <option key={d} value={d}>{d} mg{abw?` (${(d/abw).toFixed(1)} mg/kg)`:''}</option>
                      ))}
                    </select>
                    {altDose&&<div style={{fontSize:'10px',color:'#94a3b8',marginTop:'3px'}}>Infuse over {PK.infusionTime(altDose)}h (auto)</div>}
                  </div>
                  <div>
                    <label style={S.label}>Alternate interval</label>
                    <div style={{display:'flex',gap:'5px',flexWrap:'wrap',marginTop:'6px'}}>
                      {[6,8,12,24,36,48].map(t=>(
                        <button key={t} onClick={()=>setAltTau(t)} style={btnInterval(altTau===t)}>q{t}h</button>
                      ))}
                    </div>
                  </div>
                </div>

                {computedAlt&&(()=>{
                  const recAucMic = recLive.predAUC / (state.patient.mic||1);
                  // Delta indicators
                  const delta = (a, b) => {
                    const d = a - b;
                    if(Math.abs(d)<0.5) return null;
                    return <span style={{fontSize:'10px',color:d>0?'#059669':'#dc2626',marginLeft:'4px'}}>{d>0?'▲':'▼'}{Math.abs(d).toFixed(0)}</span>;
                  };
                  return (
                    <div>
                      {/* Side-by-side comparison */}
                      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'10px'}}>
                        {/* Recommended col */}
                        <div style={{background:'#f0f9ff',borderRadius:'10px',padding:'12px',border:'1px solid #bae6fd'}}>
                          <div style={{fontSize:'11px',fontWeight:'700',color:'#0369a1',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'0.05em'}}>Recommended</div>
                          {[
                            {l:'Regimen',  v:`${recLive.dose}mg q${recLive.tau}h`},
                            {l:'AUC₂₄',   v:`${recLive.predAUC.toFixed(0)}`, unit:'mg·h/L', ok:inRange(recLive.predAUC,inf.aucLow,inf.aucHigh)},
                            {l:'Trough',   v:recLive.Cmin.toFixed(1), unit:'mg/L',     ok:inRange(recLive.Cmin,inf.troughLow,inf.troughHigh)},
                            {l:'Peak',     v:recLive.Cmax.toFixed(1), unit:'mg/L',     ok:true},
                            {l:'AUC/MIC',  v:recAucMic.toFixed(0),                     ok:recAucMic>=400},
                            {l:'Daily',    v:`${recLive.daily_dose.toFixed(0)}`, unit:'mg'},
                          ].map(({l,v,unit,ok})=>(
                            <div key={l} style={{display:'flex',justifyContent:'space-between',marginBottom:'5px',fontSize:'12px'}}>
                              <span style={{color:'#64748b'}}>{l}</span>
                              <span style={{...S.mono,fontWeight:'700',color:ok===undefined?'#475569':ok?'#059669':'#dc2626'}}>{v}{unit?<span style={{fontSize:'10px',color:'#94a3b8',fontWeight:'400'}}> {unit}</span>:''}</span>
                            </div>
                          ))}
                        </div>
                        {/* Alternate col */}
                        <div style={{background:'#faf5ff',borderRadius:'10px',padding:'12px',border:'1px solid #e9d5ff'}}>
                          <div style={{fontSize:'11px',fontWeight:'700',color:'#7c3aed',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'0.05em'}}>Alternate</div>
                          {[
                            {l:'Regimen',  v:`${computedAlt.dose}mg q${computedAlt.tau}h`},
                            {l:'AUC₂₄',   v:computedAlt.predAUC.toFixed(0), unit:'mg·h/L', ok:inRange(computedAlt.predAUC,inf.aucLow,inf.aucHigh), base:recLive.predAUC},
                            {l:'Trough',   v:computedAlt.Cmin.toFixed(1),   unit:'mg/L',    ok:inRange(computedAlt.Cmin,inf.troughLow,inf.troughHigh), base:recLive.Cmin},
                            {l:'Peak',     v:computedAlt.Cmax.toFixed(1),   unit:'mg/L',    ok:true, base:recLive.Cmax},
                            {l:'AUC/MIC',  v:computedAlt.aucMic.toFixed(0),                ok:computedAlt.aucMic>=400, base:recAucMic},
                            {l:'Daily',    v:computedAlt.daily_dose.toFixed(0), unit:'mg'},
                          ].map(({l,v,unit,ok,base})=>(
                            <div key={l} style={{display:'flex',justifyContent:'space-between',marginBottom:'5px',fontSize:'12px'}}>
                              <span style={{color:'#64748b'}}>{l}</span>
                              <span style={{...S.mono,fontWeight:'700',color:ok===undefined?'#475569':ok?'#059669':'#dc2626'}}>
                                {v}{unit?<span style={{fontSize:'10px',color:'#94a3b8',fontWeight:'400'}}> {unit}</span>:''}
                                {base!==undefined&&delta(+v,+base)}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                      {/* In-range status banner */}
                      {(()=>{
                        const aucOk  = inRange(computedAlt.predAUC, inf.aucLow, inf.aucHigh);
                        const trOk   = inRange(computedAlt.Cmin,    inf.troughLow, inf.troughHigh);
                        const micOk  = computedAlt.aucMic >= 400;
                        const allOk  = aucOk && trOk && micOk;
                        return (
                          <div style={{padding:'8px 12px',borderRadius:'8px',fontSize:'12px',display:'flex',alignItems:'center',gap:'8px',
                            background:allOk?'#f0fdf4':'#fff7ed',border:`1px solid ${allOk?'#bbf7d0':'#fed7aa'}`}}>
                            <span style={{fontSize:'16px'}}>{allOk?'✅':'⚠'}</span>
                            <span style={{color:allOk?'#166534':'#9a3412',fontWeight:'600'}}>
                              {allOk
                                ? 'Alternate regimen is within all targets — clinically viable'
                                : [!aucOk&&`AUC₂₄ ${computedAlt.predAUC.toFixed(0)} out of range`,
                                   !trOk&&`Trough ${computedAlt.Cmin.toFixed(1)} out of range`,
                                   !micOk&&`AUC/MIC ${computedAlt.aucMic.toFixed(0)} < 400`
                                  ].filter(Boolean).join(' · ')
                              }
                            </span>
                          </div>
                        );
                      })()}
                    </div>
                  );
                })()}
              </div>
            )}
          </div>

          {state.patient.mode==='HD'&&(
            <div style={{marginTop:'10px',padding:'8px 12px',background:'rgba(0,212,255,0.07)',borderRadius:'6px',fontSize:'12px',color:'#0891b2'}}>
              HD: Target pre-dialysis 15–20 mg/L. Dose after each session. Monitor weekly.
            </div>
          )}
          {state.patient.mic>1&&(
            <div style={{marginTop:'10px',padding:'8px 12px',background:'rgba(255,71,87,0.08)',borderRadius:'6px',fontSize:'12px',color:'#dc2626'}}>
              ⚠ MIC {state.patient.mic} mg/L — AUC/MIC ≥ 400 unlikely. Alternative therapy strongly considered (see Alternatives tab).
            </div>
          )}
        </div>
        );
      })()}

      {/* CI Results */}
      {ciRate&&(
        <div style={S.card}>
          <div style={{...S.h2,marginBottom:'12px'}}>Continuous Infusion Plan</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'12px'}}>
            <div><div style={S.label}>Loading Dose</div><div style={{...S.mono,...S.cyan,fontSize:'16px',fontWeight:'700'}}>{ciRate.ld_low}–{ciRate.ld_high} mg</div><div style={{fontSize:'11px',...S.muted}}>Infuse over 1–2h</div></div>
            <div><div style={S.label}>CI Rate</div><div style={{...S.mono,...S.cyan,fontSize:'16px',fontWeight:'700'}}>{ciRate.rate} mg/h</div><div style={{fontSize:'11px',...S.muted}}>Dedicated line required</div></div>
            <div><div style={S.label}>Predicted AUC₂₄</div><div style={{...S.mono,...S.green,fontSize:'16px',fontWeight:'700'}}>{ciRate.auc24} mg·h/L</div><div style={{fontSize:'11px',...S.muted}}>= Css × 24</div></div>
          </div>
        </div>
      )}

      {/* AKI Status */}
      {aki&&aki.stage>0&&(
        <div style={{...S.card,borderColor:aki.stage>=2?'#ff475740':'#f59e0b40'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
            <span style={{fontSize:'20px'}}>🔴</span>
            <div>
              <div style={{fontWeight:'700',color:aki.stage>=2?'#dc2626':'#d97706'}}>KDIGO AKI Stage {aki.stage}</div>
              <div style={{fontSize:'13px',color:'#94a3b8',marginTop:'2px'}}>{aki.criteria}</div>
            </div>
          </div>
        </div>
      )}

      {/* PK Chart */}
      <div style={S.card}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div style={S.h3}>Concentration–Time Curve (72–96h)</div>
          <div style={{fontSize:'10px',color:'#94a3b8'}}>{computedAlt?'Recommended (orange) vs Alternate (purple)':'Infection targets shown as shaded zone'}</div>
        </div>
        <PKChart encounter={enc} recommendation={recLive} altRecommendation={computedAlt} patient={state.patient}/>
      </div>

      {/* Bayesian prior vs posterior */}
      {pk.CL_prior&&(
        <div style={S.card}>
          <div style={{...S.h3,marginBottom:'12px'}}>Bayesian Prior vs Posterior</div>
          <table style={{width:'100%',fontSize:'13px',borderCollapse:'collapse'}}>
            <thead>
              <tr style={{color:'#64748b',fontSize:'11px',textTransform:'uppercase'}}>
                <th style={{textAlign:'left',padding:'6px 0',fontWeight:'600'}}>Parameter</th>
                <th style={{textAlign:'right',padding:'6px 0',fontWeight:'600'}}>Prior</th>
                <th style={{textAlign:'right',padding:'6px 0',fontWeight:'600'}}>Posterior</th>
                <th style={{textAlign:'right',padding:'6px 0',fontWeight:'600'}}>Change</th>
              </tr>
            </thead>
            <tbody>
              {[
                {p:'CL (L/h)',pr:pk.CL_prior,po:pk.CL_post},
                {p:'Vd (L)',pr:pk.Vd_prior,po:pk.Vd_post},
                {p:'Ke (h⁻¹)',pr:pk.CL_prior/pk.Vd_prior,po:pk.ke},
                {p:'t½ (h)',pr:0.693/(pk.CL_prior/pk.Vd_prior),po:pk.t_half},
              ].map(({p,pr,po})=>{
                const delta=((po-pr)/pr*100);
                return(
                  <tr key={p} style={{borderTop:'1px solid #e2e8f0'}}>
                    <td style={{padding:'8px 0',color:'#94a3b8',fontFamily:'monospace'}}>{p}</td>
                    <td style={{textAlign:'right',padding:'8px 0',fontFamily:'monospace',color:'#64748b'}}>{pr.toFixed(3)}</td>
                    <td style={{textAlign:'right',padding:'8px 0',fontFamily:'monospace',color:'#0891b2',fontWeight:'600'}}>{po.toFixed(3)}</td>
                    <td style={{textAlign:'right',padding:'8px 0',fontFamily:'monospace',color:Math.abs(delta)>15?'#d97706':'#64748b',fontSize:'12px'}}>{delta>0?'+':''}{delta.toFixed(0)}%</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      <div style={{fontSize:'11px',color:'#94a3b8',textAlign:'center',padding:'8px',borderTop:'1px solid #e2e8f0'}}>
        Based on 2020 ASHP/IDSA/PIDS/SIDP Vancomycin Consensus Guidelines [A-II] • Clinical Decision Support Only
      </div>
    </div>
  );
}

    },

      monitor:'CBC weekly (thrombocytopenia). Screen serotonergic drugs. Lactic acid if prolonged.',

              </div>

      )}
      {!showTrigger&&(
        <div style={{...S.card,padding:'12px 16px',fontSize:'13px',color:'#64748b'}}>

      {agents.map(a=>(

      </div>

  );
